<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statki Edukacyjne - EduNav</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #login-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 15, 25, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #1b263b;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            text-align: center;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-content h1 {
            color: #00ffcc;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #0b0f19;
            border: 1px solid #415a77;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }

        .modal-content button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #00ffcc;
            color: #0b0f19;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        .modal-content button:hover {
            background: #00b38f;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            width: 85%;
            z-index: 10;
            display: none;
        }

        #question-container {
            background: rgba(11, 15, 25, 0.85);
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid rgba(255, 204, 0, 0.3);
            display: inline-block;
            max-width: 900px;
            pointer-events: auto;
        }

        #question-text {
            font-size: 18px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 10px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        .answers-preview {
            display: flex;
            gap: 15px;
            justify-content: center;
            font-size: 14px;
            color: #00ffcc;
            flex-wrap: wrap;
        }

        .answers-preview span {
            background: rgba(0, 255, 204, 0.1);
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 204, 0.3);
        }

        #game-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 15px;
            z-index: 10;
        }

        .game-btn {
            background: #1b263b;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .game-btn:hover {
            background: #00ffcc;
            color: #0b0f19;
        }

        #stats-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 15, 25, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .stats-box {
            background: #1b263b;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #00ffcc;
            width: 320px;
            text-align: center;
        }

        .stats-box h2 {
            color: #00ffcc;
            margin-top: 0;
        }

        #stats-content {
            text-align: left;
            margin: 15px 0;
            line-height: 1.6;
            font-size: 15px;
        }

        #loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.9);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #00ffcc;
        }

        .spinner {
            border: 4px solid rgba(0, 255, 204, 0.2);
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border-top-color: #00ffcc;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading-overlay h2 {
            margin-top: 20px;
            font-size: 22px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        #loading-overlay p {
            color: #8b9bb4;
            font-size: 14px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="login-modal">
        <div class="modal-content">
            <h1>Statki Edukacyjne</h1>
            <input type="email" id="input-email" placeholder="Twój adres e-mail" required>
            <select id="select-temat">
                <option value="">-- Wybierz istniejący temat --</option>
            </select>
            <input type="text" id="input-nowy-temat" placeholder="Lub wpisz nowy temat...">
            <button id="btn-start">Rozpocznij Rejs</button>
        </div>
    </div>

    <div id="hud">
        <div id="question-container">
            <div id="question-text">Ładowanie pytania...</div>
            <div class="answers-preview">
                <span>Port A: <strong id="ans-a">...</strong></span>
                <span>Port B: <strong id="ans-b">...</strong></span>
                <span>Port C: <strong id="ans-c">...</strong></span>
            </div>
        </div>
    </div>

    <div id="game-controls">
        <button id="btn-show-stats" class="game-btn">Mój Postęp</button>
        <button id="btn-exit" class="game-btn">Koniec Gry</button>
    </div>

    <div id="stats-modal">
        <div class="stats-box">
            <h2>Statystyki Gracza</h2>
            <div id="stats-content">Ładowanie...</div>
            <button id="btn-close-stats" class="game-btn" style="width:100%; margin-top:10px;">Zamknij</button>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <h2>Sztuczna inteligencja generuje nową porcję wiedzy...</h2>
        <p>Proszę czekać, trwa rozbudowa bazy pytań w tle.</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
