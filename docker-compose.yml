version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ships_sql_server
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "StrongPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - mssql_ships_data:/var/opt/mssql
      - ./backup:/var/opt/mssql/backup

volumes:
  mssql_ships_data: